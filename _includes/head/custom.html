<style>
/* ── Global typography & palette ── */
html, body {
  background-color: #f9f7f4;
  font-family: 'Spectral', Georgia, serif;
  color: #2d3748;
}
/* Proper sticky footer: pin footer to viewport bottom on short pages,
   flow naturally on long pages. Replaces the theme's absolute-position hack. */
body {
  padding-bottom: 0 !important;
  display: flex !important;
  flex-direction: column !important;
  min-height: 100vh !important;
}
#main { flex: 1 0 auto !important; }
/* Footer */
.page__footer {
  flex-shrink: 0 !important;
  background-color: #f9f7f4 !important;
  position: relative !important;
  bottom: auto !important;
  border-top: 1px solid #e2e8f0 !important;
  margin-top: 1.5em !important;
}
.page__footer footer {
  background-color: #f9f7f4 !important;
  margin-top: 0 !important;
  padding: 0.5em 1em 1.4em !important;
}
.page__footer-follow {
  margin: 0 !important;
}
.page__footer-follow ul {
  margin: 0 !important;
}
.page__footer-follow li {
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
.page__footer-follow li,
.page__footer-follow a {
  font-size: 0.62em !important;
  color: #c0c8d2 !important;
  text-transform: none !important;
  font-family: 'Spectral', Georgia, serif !important;
}
.page__footer-follow strong { font-weight: normal !important; }
.page__footer-copyright {
  font-size: 0.62em !important;
  color: #c0c8d2 !important;
  font-family: 'Spectral', Georgia, serif !important;
  margin-top: 0.15em !important;
}
.page__footer a { color: #c0c8d2 !important; }
.page__footer a:hover { color: #94a0ad !important; }
.page__footer .fas,
.page__footer .fab,
.page__footer .far,
.page__footer .fal,
.page__footer .fa { color: #c0c8d2 !important; }
/* Mobile nav dropdown */
.greedy-nav__toggle,
.hidden-links,
.greedy-nav .hidden-links {
  background-color: #f9f7f4 !important;
}
p, li, .page__content, .archive__item-excerpt {
  font-family: 'Spectral', Georgia, serif;
  line-height: 1.78;
  font-size: 1.02em;
}
h1, h2, h3, h4, h5 {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
a {
  color: #2b6cb0;
}
a:hover {
  color: #1a4a7a;
  text-decoration: underline;
}
/* Masthead / nav */
.masthead {
  background-color: #f9f7f4 !important;
  border-bottom: none !important;
  box-shadow: none !important;
}
.masthead__inner-wrap,
.greedy-nav {
  background-color: #f9f7f4 !important;
}
.masthead__inner-wrap a,
.greedy-nav a {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
/* Hamburger button */
.greedy-nav button {
  background-color: #f9f7f4 !important;
  color: #1a2a4a !important;
}
.navicon,
.navicon::before,
.navicon::after {
  background: #1a2a4a !important;
}
/* Mobile dropdown menu */
.hidden-links {
  background-color: #f9f7f4 !important;
  border: 1px solid #dde3ed !important;
}
/* Sidebar */
.sidebar {
  background-color: #f9f7f4;
}
.author__name {
  font-family: 'Spectral', Georgia, serif !important;
  color: #1a2a4a !important;
}
.author__bio {
  font-family: 'Spectral', Georgia, serif !important;
  font-size: 0.88em !important;
  color: #4a5568 !important;
}
.author__urls-wrapper,
.author__urls,
.author__urls li,
.author__urls a,
.author__desktop {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.9em;
  color: #2d3748;
}
.author__urls a {
  color: #2b6cb0;
}
.author__urls a:hover {
  color: #1a4a7a;
}
/* Sidebar links removed entirely (name + title only). */
.author__urls-wrapper,
.author__urls-wrapper button { display: none !important; }

/* Large portrait photo. Source is 4:5 so object-fit has nothing to crop. */
.author__avatar { width: 100% !important; display: block !important; }
.author__avatar img {
  width: 100% !important;
  max-width: 300px !important;
  height: auto !important;
  aspect-ratio: 4 / 5;
  object-fit: cover;
  border-radius: 3px !important;
}

/* Two-column layout. Replaces the theme's Susy float grid with flex so the
   masthead and the body share identical columns at any width: the name sits
   over the photo, the nav links over the text. */
@media screen and (min-width: 925px) {
  #main { display: flex !important; gap: 44px; }
  .sidebar {
    width: 300px !important;
    flex: 0 0 300px !important;
    max-width: none !important;
    float: none !important;
    margin: 0 !important;
    padding: 0 !important;
    position: sticky !important;
    top: 88px;
    height: auto !important;
    overflow: visible !important;
    opacity: 1 !important;
  }
  #main > .page,
  #main > .archive,
  #main > article.page {
    flex: 1 1 auto !important;
    width: auto !important;
    min-width: 0 !important;
    float: none !important;
    margin: 0 !important;
    padding-left: 0 !important;
    padding-right: 0 !important;
  }
  /* Keep the link list shrink-wrapped: greedy-nav measures its width to decide
     what to collapse into the hamburger, so a full-width flex row hides
     everything. inline-flex shrink-wraps the way the theme's table did. */
  .greedy-nav .visible-links { display: inline-flex !important; align-items: baseline; }
  .greedy-nav .visible-links li { display: block !important; }
  .greedy-nav .visible-links .masthead__menu-item--lg {
    flex: 0 0 300px !important;
    width: 300px !important;
    padding-right: 0 !important;
    margin-right: 44px !important;
  }
  .greedy-nav .visible-links .masthead__menu-item--lg a {
    margin-left: 0 !important;
    font-size: 1.45em;
  }
  .greedy-nav .visible-links li:not(.masthead__menu-item--lg) a {
    margin-left: 0 !important;
    margin-right: 34px !important;
    font-size: 1.12em;
  }
}
/* Page title */
.page__title {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
</style>

<!-- Open all PDF links in a new tab -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href$=".pdf"]').forEach(function(a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener');
    });
  });
</script>

<!-- end custom head snippets -->
