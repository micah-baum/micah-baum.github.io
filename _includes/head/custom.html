<style>
/* ── Global typography & palette ── */
html, body {
  background-color: #f9f7f4;
  font-family: 'Spectral', Georgia, serif;
  color: #2d3748;
}
/* Proper sticky footer: pin footer to viewport bottom on short pages,
   flow naturally on long pages. Replaces the theme's absolute-position hack. */
body {
  padding-bottom: 0 !important;
  display: flex !important;
  flex-direction: column !important;
  min-height: 100vh !important;
}
#main { flex: 1 0 auto !important; }
/* Footer */
.page__footer {
  flex-shrink: 0 !important;
  background-color: #f9f7f4 !important;
  position: relative !important;
  bottom: auto !important;
  border-top: 1px solid #e2e8f0 !important;
  margin-top: 1.5em !important;
}
.page__footer footer {
  background-color: #f9f7f4 !important;
  margin-top: 0 !important;
  padding: 0.5em 1em 1.4em !important;
}
.page__footer-follow {
  margin: 0 !important;
}
.page__footer-follow ul {
  margin: 0 !important;
}
.page__footer-follow li {
  padding-top: 0 !important;
  padding-bottom: 0 !important;
}
.page__footer-follow li,
.page__footer-follow a {
  font-size: 0.62em !important;
  color: #c0c8d2 !important;
  text-transform: none !important;
  font-family: 'Spectral', Georgia, serif !important;
}
.page__footer-follow strong { font-weight: normal !important; }
.page__footer-copyright {
  font-size: 0.62em !important;
  color: #c0c8d2 !important;
  font-family: 'Spectral', Georgia, serif !important;
  margin-top: 0.15em !important;
}
.page__footer a { color: #c0c8d2 !important; }
.page__footer a:hover { color: #94a0ad !important; }
.page__footer .fas,
.page__footer .fab,
.page__footer .far,
.page__footer .fal,
.page__footer .fa { color: #c0c8d2 !important; }
/* Mobile nav dropdown */
.greedy-nav__toggle,
.hidden-links,
.greedy-nav .hidden-links {
  background-color: #f9f7f4 !important;
}
p, li, .page__content, .archive__item-excerpt {
  font-family: 'Spectral', Georgia, serif;
  line-height: 1.78;
  font-size: 1.02em;
}
h1, h2, h3, h4, h5 {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
a {
  color: #2b6cb0;
}
a:hover {
  color: #1a4a7a;
  text-decoration: underline;
}
/* Masthead / nav */
.masthead {
  background-color: #f9f7f4 !important;
  border-bottom: none !important;
  box-shadow: none !important;
}
.masthead__inner-wrap,
.greedy-nav {
  background-color: #f9f7f4 !important;
}
.masthead__inner-wrap a,
.greedy-nav a {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
/* Hamburger button */
.greedy-nav button {
  background-color: #f9f7f4 !important;
  color: #1a2a4a !important;
}
.navicon,
.navicon::before,
.navicon::after {
  background: #1a2a4a !important;
}
/* Mobile dropdown menu */
.hidden-links {
  background-color: #f9f7f4 !important;
  border: 1px solid #dde3ed !important;
}
/* Sidebar */
.sidebar {
  background-color: #f9f7f4;
}
.author__name {
  font-family: 'Spectral', Georgia, serif !important;
  color: #1a2a4a !important;
}
.author__bio {
  font-family: 'Spectral', Georgia, serif !important;
  font-size: 0.88em !important;
  color: #4a5568 !important;
}
.author__urls-wrapper,
.author__urls,
.author__urls li,
.author__urls a,
.author__desktop {
  font-family: 'Spectral', Georgia, serif;
  font-size: 0.9em;
  color: #2d3748;
}
.author__urls a {
  color: #2b6cb0;
}
.author__urls a:hover {
  color: #1a4a7a;
}
/* Remove the narrow-screen "Follow" toggle and render the author links inline
   at every width (below 925px the theme hides them behind that button and
   styles them as an absolutely-positioned dropdown). */
.author__urls-wrapper button { display: none !important; }
.author__urls-wrapper { display: block !important; }
.author__urls {
  display: block !important;
  position: relative !important;
  right: auto !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
  z-index: auto !important;
}
.author__urls:before,
.author__urls:after { display: none !important; }
/* Page title */
.page__title {
  font-family: 'Spectral', Georgia, serif;
  color: #1a2a4a;
}
</style>

<!-- Open all PDF links in a new tab -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('a[href$=".pdf"]').forEach(function(a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener');
    });
  });
</script>
